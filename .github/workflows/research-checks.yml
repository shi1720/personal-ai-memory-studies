name: Research checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measurement-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-analysis.txt
      - name: Install analysis dependencies
        run: python -m pip install -r requirements-analysis.txt
      - name: Test measurement logic
        run: python -m unittest discover -s tests
      - name: Recreate figure from released measurements
        run: python src/plot_coat_memory_development.py
