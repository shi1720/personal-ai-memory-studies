name: Research checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measurement-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-analysis.txt
      - name: Verify released file hashes
        run: |
          python - <<'PYCODE'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path("release-manifest.json").read_text())
          bad = [name for name, expected in manifest["files"].items()
                 if not Path(name).is_file()
                 or hashlib.sha256(Path(name).read_bytes()).hexdigest() != expected]
          if bad:
              raise SystemExit("Release manifest mismatch: " + ", ".join(bad))
          print(f"Verified {len(manifest['files'])} released file hashes")
          PYCODE
      - name: Install analysis dependencies
        run: python -m pip install -r requirements-analysis.txt
      - name: Test measurement logic
        run: python -m unittest discover -s tests
      - name: Recreate figure from released measurements
        run: python src/plot_coat_memory_development.py
      - name: Verify final published statistics
        if: ${{ hashFiles('results/confirmation-analysis.json', 'results/movie-validation-analysis.json') != '' }}
        run: |
          python src/verify_published_results.py
          python src/build_confirmation_figures.py
          python src/build_confirmation_tables.py
      - name: Verify anonymous review supplement in isolation
        run: |
          python -m venv "$RUNNER_TEMP/anonymous-env"
          python -m zipfile -e output/submission/Personal_AI_Memory_Anonymous_Artifact.zip "$RUNNER_TEMP/anonymous-artifact"
          "$RUNNER_TEMP/anonymous-env/bin/python" -m pip install -r "$RUNNER_TEMP/anonymous-artifact/requirements.txt"
          cd "$RUNNER_TEMP/anonymous-artifact"
          "$RUNNER_TEMP/anonymous-env/bin/python" src/verify_published_results.py
          "$RUNNER_TEMP/anonymous-env/bin/python" -m unittest discover -s tests
